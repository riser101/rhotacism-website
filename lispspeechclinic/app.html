    // Target of the QR code in the desktop "Free Assessment" modal (nav.js).
    // iPhone/iPad → the Lisp Program custom product page; anything else → the web test.
    (function () {
      var APP = 'https://apps.apple.com/app/id6751569088?ppid=25953659-1662-49e0-9bf3-036161ce27df';

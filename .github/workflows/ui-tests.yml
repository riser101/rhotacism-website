name: UI tests

# Gate the deployment flow: staging deploys (push to `staging`) and prod
# promotions (push to `main`) both run the Playwright suite. Vercel deploys
# independently, so a red run here is the signal to roll back / not promote.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (inline nav/footer, same as Vercel)
        run: node build.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

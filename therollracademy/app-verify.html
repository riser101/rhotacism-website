<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Opening Rollr…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            text-align: center;
        }
        .card { padding: 32px 24px; max-width: 340px; }
        .eyebrow {
            color: #FF8B42;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 { font-size: 28px; margin: 12px 0 8px; }
        p { color: rgba(255,255,255,0.8); font-size: 15px; line-height: 1.5; }
        a.open {
            display: block;
            margin-top: 24px;
            padding: 16px;
            border-radius: 14px;
            background: #141410;
            border: 1px solid rgba(255,255,255,0.18);
            color: #FF8B42;
            font-weight: 700;
            font-size: 17px;
            text-decoration: none;
        }
        #wrongDevice { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="eyebrow">Verify your email</div>
        <h1>Opening Rollr…</h1>
        <p id="hasApp">Finishing sign-in in the app. If nothing happens, tap below.</p>
        <p id="wrongDevice">This link needs to be opened on the phone that has the Rollr app installed. Open this email on your phone and tap the link there.</p>
        <a class="open" id="openApp" href="#">Open Rollr</a>
    </div>
    <script>
        // The Firebase action page redirects here with the sign-in oobCode still
        // in the URL, so the full current URL IS the email sign-in link. Forward
        // it into the app; AuthenticationManager.handleAuthLink() consumes it.
        (function () {
            var appLink = 'rollr://auth?link=' + encodeURIComponent(window.location.href);
            document.getElementById('openApp').setAttribute('href', appLink);

            var isAndroid = /android/i.test(navigator.userAgent);
            if (isAndroid) {
                // Auto-forward; the anchor stays as a manual fallback.
                window.location.replace(appLink);
            } else {
                document.getElementById('hasApp').style.display = 'none';
                document.getElementById('wrongDevice').style.display = 'block';
            }
        })();
    </script>
    <!-- Start of HubSpot Embed Code -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/247241182.js"></script>
    <!-- End of HubSpot Embed Code -->
</body>
</html>
